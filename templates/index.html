<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Desmos & FastAPI Integration</title>
        <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=46b18f76f2034f3cba8a3a41b0f7abb2"></script>
        <style>
            body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
            #calculator { width: 100%; max-width: 900px; height: 500px; margin-top: 15px; }
            .controls { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
            input, button { padding: 8px 12px; font-size: 14px; }
        </style>
    </head>
    <body>
        <h1>FastAPI & Desmos Integration</h1>

        <div class="controls">
            <input type="text" id="graphTitle" placeholder="Graph Title">
            <button onclick="saveGraph()">Save Graph</button>
        </div>

        <div class="controls">
            <input type="number" id="loadId" placeholder="Graph ID to Load">
            <button onclick="loadGraph()">Load Graph</button>
            <button onclick="generateExpression()">Generate Expression</button>
        </div>

        <div id="calculator"></div>

        <script src="/static/js/main.js"></script>
    </body>
</html>
